function blocked(x,y){return'THRDWFSX'.includes(tile(G.m,x,y))||NP.some(n=>n.m==G.m&&n.x==x&&n.y==y)}
function mv(d){G.d=d;const[dx,dy]=DV[d],nx=G.x+dx,ny=G.y+dy;if(blocked(nx,ny))return;G.x=nx;G.y=ny;G.ox=-dx*16;G.oy=-dy*16}
function setMap(m,x,y){G.m=m;G.x=x;G.y=y;G.ox=G.oy=0}
function arrive(){const w=WP[G.m].find(w=>w.x==G.x&&w.y==G.y);if(w){run(function*(){yield fade(1);setMap(w.to,w.tx,w.ty);yield fade(0)});return}
if(tile(G.m,G.x,G.y)=='g'&&Math.random()<.14){run(function*(){yield*battle([wild()])});return}
if(G.m=='forest'&&G.y<=6&&!G.f.rec)run(recEv)}
function act(){const[dx,dy]=DV[G.d],x=G.x+dx,y=G.y+dy,n=NP.find(n=>n.m==G.m&&n.x==x&&n.y==y),ch=tile(G.m,x,y);
if(n){n.d=opp[G.d];run(n.f)}else if(ch=='S')say(SG[G.m+':'+x+','+y]);else if(ch=='D')say('A porta está trancada. Não há tempo para voltar para casa!');else if(ch=='X')run(emb)}
function world(){if(G.ox||G.oy){G.ox-=Math.sign(G.ox)*2;G.oy-=Math.sign(G.oy)*2;if(!G.ox&&!G.oy)arrive();return}
for(const d of['u','d','l','r'])if(K[d]){mv(d);return}
if(P.A)act();else if(P.S)run(function*(){yield menu(['POKÉMON','MOCHILA','SALVAR','FECHAR'],140,6,96,1,1);if(mr==0)yield say(G.party.map(m=>m.n+' Nv'+m.l+' PS '+m.hp+'/'+m.mh));else if(mr==1)yield say('Poké Bolas: '+G.balls);else if(mr==2)yield say(save()?'Jogo salvo!':'Não foi possível salvar neste navegador.')})}
const KEY='darkarchive_v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({m:G.m,x:G.x,y:G.y,d:G.d,party:G.party,balls:G.balls,f:G.f}));return 1}catch(e){return 0}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
/* eventos */
function* profTalk(){G.party.forEach(m=>m.hp=m.mh);yield say(['PROF. CARVALHO: Cuidado nas rotas, Kai! Deixei seus Pokémon descansados.','E fique de olho no símbolo vermelho.'])}
function* boyTalk(){yield say(['Vi gente toda de preto na Floresta de Viridian.','Parece que estão atrás de alguma coisa...'])}
function* recEv(){yield say(['RECRUTA: Alto aí! Esta área foi interditada pela Organização!','Ninguém passa daqui!']);const r=yield*battle([mon('Rattata',5),mon('Caterpie',5)],'RECRUTA');if(r!='win')return;G.f.rec=1;NP=NP.filter(n=>n.id!='rec');yield say('RECRUTA: Impossível... O Estrategista não vai gostar nada disso!')}
function* emb(){yield say(['Um selo vermelho gravado no chão: o mesmo símbolo deixado no laboratório do Prof. Carvalho.','Marcas de equipamentos pesados... e letras quase apagadas: DARK ARCHIVE.']);if(!G.f.end){G.f.end=1;yield say(['* FIM DO PROTÓTIPO *','Você completou o vertical slice de Pokémon: Dark Archive.','Pewter City e o resto de Kanto virão nas próximas fases. Continue explorando!'])}}
function* blackout(){yield say('Você ficou sem Pokémon capazes de lutar...');yield fade(1);G.party.forEach(m=>m.hp=m.mh);mode='world';B=null;setMap('pallet',10,9);yield fade(0);yield say('PROF. CARVALHO: Você desmaiou! Cuidei dos seus Pokémon. Volte quando estiver pronto.')}
function* intro(){mode='world';yield fade(0);yield say(['PROF. CARVALHO: Kai! Finalmente você chegou!','Hoje começa a sua jornada Pokémon. Escolha o seu primeiro parceiro!']);
yield menu(['BULBASAUR','CHARMANDER','SQUIRTLE'],8,52,112);const n=['Bulbasaur','Charmander','Squirtle'][mr];G.party=[mon(n,5)];G.f.st=n;
yield say([n.toUpperCase()+'! Excelente escolha!','Ele é o seu parceiro a partir de agora.']);const rn={Bulbasaur:'Charmander',Charmander:'Squirtle',Squirtle:'Bulbasaur'}[n];
NP.push({m:'pallet',id:'ren',x:11,y:6,d:'l',c:CP.ren,f:function*(){}});
yield say(['REN: Hmpf. Então este é o tal Kai.','Eu fico com o '+rn.toUpperCase()+'. Ele leva vantagem sobre o seu. Vamos ver o que você sabe!']);
const r=yield*battle([mon(rn,4)],'REN',1);
yield say([r=='win'?'REN: ... Foi sorte. Só isso.':'REN: Fraco. Volte quando souber lutar.','Vou ser o Campeão antes de você, Kai!']);NP=NP.filter(n=>n.id!='ren');G.party.forEach(m=>m.hp=m.mh);
yield say(['PROF. CARVALHO: Muito bem! Tome estas Poké Bolas.','Kai... alguém invadiu meu laboratório à noite e levou registros antigos.','Só sobrou este símbolo vermelho na mesa. Se vir algo parecido, me avise!','(Setas andam, Z confirma, X volta e Esc abre o menu.)']);
G.balls=5;const p=NP.find(n=>n.id=='prof');p.x=14;p.y=5}
function* title(){mode='title';yield fade(0);yield()=>P.A||P.S;const s=load(),o=s?['CONTINUAR','NOVO JOGO']:['NOVO JOGO'];yield menu(o,84,108,96);
if(o[mr]=='CONTINUAR'){G=Object.assign(newG(),s,{ox:0,oy:0});NP=mkNP();yield fade(1);mode='world';yield fade(0)}
else{G=newG();NP=mkNP();const p=NP[0];p.x=10;p.y=6;yield fade(1);yield*intro()}}
/* batalha */
function* atk(a,d,mv,s){yield say(a.n+(a===B.e&&!B.tr?' selvagem':'')+' usou '+mv[0]+'!');const[dm,e]=dmg(a,d,mv),ds=s=='p'?'e':'p';d.hp=Math.max(0,d.hp-dm);B.sk=[ds,16];yield wf(14);yield()=>(ds=='e'?B.eh:B.ph)==d.hp;if(e>1)yield say('Foi super efetivo!');else if(e<1)yield say('Não foi muito efetivo...')}
function* gain(){const m=B.p;if(m.hp<=0)return;const x=B.e.l*7;m.xp+=x;yield say(m.n+' ganhou '+x+' pontos de experiência!');while(m.xp>=m.l*10&&m.l<100){m.xp-=m.l*10;m.l++;lvUp(m);B.ph=m.hp;yield say(m.n+' subiu para o nível '+m.l+'!')}}
function* battle(tm,tr,soft){const first=()=>G.party.find(m=>m.hp>0);B={tm,tr,ei:0,e:tm[0],p:first(),sk:null,ef:0,pf:0,ask:''};B.eh=B.e.hp;B.ph=B.p.hp;mode='battle';yield flash();
yield say(tr?[tr+' quer batalhar!',tr+' enviou '+B.e.n.toUpperCase()+'!']:['Um '+B.e.n.toUpperCase()+' selvagem apareceu!']);yield say('Vai, '+B.p.n.toUpperCase()+'!');let res='';
while(!res){B.ask='O que '+B.p.n+' vai fazer?';yield menu(['LUTAR','BOLA','FUGIR'],132,112,104,2);B.ask='';const c=mr;
if(c==1){if(tr){yield say('Não dá para capturar o Pokémon de outro treinador!');continue}if(!G.balls){yield say('Você não tem Poké Bolas!');continue}
G.balls--;yield say('Você lançou uma Poké Bola!');yield wf(40);const e=B.e,p=Math.min(.95,(1-e.hp/e.mh*.66)*.75+.12-e.l*.01);
if(Math.random()<p){yield say('Gotcha! '+e.n+' foi capturado!');if(G.party.length<6)G.party.push(e);else yield say(e.n+' foi enviado ao PC.');res='caught';break}yield say('Ah! Escapou da Poké Bola!')}
else if(c==2){if(tr){yield say('Não dá para fugir de uma batalha de treinador!');continue}if(Math.random()<.75||B.p.sp>=B.e.sp){yield say('Você fugiu em segurança!');res='run';break}yield say('Não conseguiu fugir!')}
else{yield menu(B.p.mv.map(m=>m[0]),4,112,160,1,1);if(mr<0)continue;const pm=B.p.mv[mr],em=B.e.mv[Math.random()*B.e.mv.length|0],o=B.p.sp>=B.e.sp?[[B.p,B.e,pm,'p'],[B.e,B.p,em,'e']]:[[B.e,B.p,em,'e'],[B.p,B.e,pm,'p']];
for(const[a,d,m,s]of o){yield*atk(a,d,m,s);if(d.hp<=0)break}
if(B.e.hp<=0){B.ef=1;yield()=>B.ef>=16;yield say(B.e.n+(tr?'':' selvagem')+' desmaiou!');yield*gain();if(B.ei+1<tm.length){B.ei++;B.e=tm[B.ei];B.eh=B.e.hp;B.ef=0;yield say(tr+' enviou '+B.e.n.toUpperCase()+'!')}else res='win'}
else if(B.p.hp<=0){B.pf=1;yield()=>B.pf>=16;yield say(B.p.n+' desmaiou!');const n=first();if(n){B.p=n;B.ph=n.hp;B.pf=0;yield say('Vai, '+n.n.toUpperCase()+'!')}else res='lose'}}}
if(res=='lose'){if(soft){yield say(tr+' venceu a batalha!');G.party.forEach(m=>m.hp=m.mh)}else yield*blackout()}
if(res=='win'&&tr)yield say(tr+' foi derrotado!');mode='world';B=null;return res}
function stat(m,x,y,h,me){box(x,y,110,me?36:26);T(m.n.toUpperCase(),x+7,y+6);T('Nv'+m.l,x+7,y+16);const r=h/m.mh;g.fillStyle='#000';g.fillRect(x+51,y+16,52,6);g.fillStyle='#333';g.fillRect(x+52,y+17,50,4);g.fillStyle=r>.5?'#48d048':r>.2?'#f8c830':'#e02035';g.fillRect(x+52,y+17,Math.ceil(50*r),4);if(me)T(Math.ceil(h)+'/'+m.mh,x+52,y+26)}
function drawB(){const f=G.m=='forest';g.fillStyle=f?'#1c2f24':'#b8e0a0';g.fillRect(0,0,W,112);g.fillStyle=f?'#142218':'#98cc80';g.fillRect(0,60,W,52);if(f){g.fillStyle='#760d18';g.fillRect(0,59,W,1)}
el(g,182,70,42,7,f?'#0c160f':'#78a860');el(g,64,108,50,8,f?'#0c160f':'#78a860');
drawMon(B.e.n,150,6,2,0,B.ef,'e');drawMon(B.p.n,16,22,3,1,B.pf,'p');stat(B.e,6,8,B.eh,0);stat(B.p,124,72,B.ph,1);
if(B.ask&&!D&&!M){box(4,112,124,44);wrap(B.ask,108).forEach((l,i)=>T(l,12,122+i*14))}}
/* mundo: desenho */
function drawW(){const m=MP[G.m],cx=Math.max(0,Math.min(m.r[0].length*16-W,G.x*16+G.ox-112)),cy=Math.max(0,Math.min(m.r.length*16-H,G.y*16+G.oy-72));
for(let ty=cy>>4;ty<=(cy+H)>>4;ty++)for(let tx=cx>>4;tx<=(cx+W)>>4;tx++){const ch=(m.r[ty]||'')[tx]||'T';g.drawImage(tl(ch,ch=='W'?(fr>>5)&1:m.th),tx*16-cx,ty*16-cy)}
NP.filter(n=>n.m==G.m).map(n=>({y:n.y*16,x:n.x*16,d:n.d,c:n.c,s:0})).concat([{y:G.y*16+G.oy,x:G.x*16+G.ox,d:G.d,c:CP.kai,s:(G.ox||G.oy)?(Math.abs(G.ox+G.oy)>>3)&1:0}]).sort((a,b)=>a.y-b.y).forEach(e=>person(e.x-cx,e.y-cy,e.d,e.s,e.c));
if(m.th){g.fillStyle='rgba(8,8,8,.42)';g.fillRect(0,0,W,H);const ex=120-cx,ey=72-cy;for(let r=5;r>0;r--)el(g,ex,ey,r*10,r*7,'rgba(224,32,53,'+((.05+.012*Math.sin(fr/15))*(6-r)/2)+')')}}
/* título */
function drawT(){g.fillStyle='#080808';g.fillRect(0,0,W,H);for(let i=6;i>0;i--)el(g,176,74,i*20,i*14,'rgba(181,18,36,'+(.05+i*.014)+')');
g.fillStyle='#000';g.beginPath();[[150,160],[158,92],[150,48],[160,52],[166,30],[170,56],[180,56],[186,28],[192,52],[204,48],[196,94],[208,160]].forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.fill();
g.strokeStyle='#b51224';g.lineWidth=1;g.beginPath();[[170,160],[174,120],[168,104],[176,92]].forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.moveTo(190,160);g.lineTo(186,128);g.lineTo(192,112);g.stroke();
const gl=fr>>4&1;g.fillStyle=gl?'#ff3949':'#e02035';g.fillRect(164,66,8,2);g.fillRect(182,66,8,2);
for(let i=0;i<26;i++){g.fillStyle=i%2?'#ff3949':'#b51224';g.fillRect(((i*53)%240+Math.sin(fr/30+i)*4)|0,(160-((fr*.5+i*37)%160))|0,1,1)}
T('POKÉMON',14,16,'#ff6673','#45070d',16);T('DARK',14,42,'#e02035','#45070d',24);T('ARCHIVE',14,72,'#dcdcdc','#760d18',24);g.fillStyle='#b51224';g.fillRect(14,104,150,2);g.fillStyle='#45070d';g.fillRect(14,106,150,1);
if(!M&&(fr>>5&1))T('PRESSIONE START',14,122);T('PROTÓTIPO · PROJETO DE FÃ',14,148,'#7a7a7a','#111')}
/* laço principal */
function upd(){fr++;const busy=!!(S||D||M);FD+=Math.sign(FT-FD)*Math.min(.1,Math.abs(FT-FD));if(FL>0)FL--;
if(D)updD();else if(M)updM();stepS();
if(B){const lp=(c,t,m)=>{const s=Math.max(.35,m/90);return Math.abs(c-t)<=s?t:c+Math.sign(t-c)*s};B.eh=lp(B.eh,B.e.hp,B.e.mh);B.ph=lp(B.ph,B.p.hp,B.p.mh);if(B.sk&&--B.sk[1]<=0)B.sk=null;if(B.ef>0&&B.ef<16)B.ef+=.5;if(B.pf>0&&B.pf<16)B.pf+=.5}
if(!busy&&mode=='world'&&G)world();for(const k in P)P[k]=0}
function draw(){if(mode=='title')drawT();else if(mode=='battle'&&B)drawB();else if(G)drawW();drawM();drawD();
if(FL>0){g.globalAlpha=.4;g.fillStyle=(FL>>2)&1?'#fff':'#b51224';g.fillRect(0,0,W,H);g.globalAlpha=1}
if(FD>0){g.fillStyle='rgba(8,8,8,'+FD+')';g.fillRect(0,0,W,H)}}
let last=0,acc=0;function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.67){acc-=16.67;upd()}draw();requestAnimationFrame(loop)}
Promise.race([document.fonts.load('8px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]).then(()=>{run(title);requestAnimationFrame(loop)});
</script></body></html>
